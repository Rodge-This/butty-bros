<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Butty Bros">
  <title>Butty Bros</title>
  <!-- Solid black disc — melts into dark headers, reads as a mark on light -->
  <circle cx="100" cy="100" r="98" fill="#0E0E0E"/>
  <!-- Characteristic double inner ring -->
  <circle cx="100" cy="100" r="83" fill="none" stroke="#F5EFE3" stroke-width="1.3"/>
  <circle cx="100" cy="100" r="79" fill="none" stroke="#F5EFE3" stroke-width="1.3"/>
  <!-- Wordmark: heavy geometric sans matched to the real logo -->
  <text x="100" y="101"
        text-anchor="middle" dominant-baseline="central"
        font-family="'Montserrat', 'Poppins', 'Arial Black', sans-serif"
        font-weight="800" font-size="21" letter-spacing="0.5"
        fill="#F5EFE3">BUTTY BROS</text>
</svg>
